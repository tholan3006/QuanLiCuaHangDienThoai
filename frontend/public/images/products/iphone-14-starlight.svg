    <rect x="173" y="109" width="154" height="318" rx="33" fill="url(#body-sta)"/>
    
    <rect x="190" y="128" width="72" height="74" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtle-shadow)" />
    <!-- Cam Top-Left -->
    <circle cx="211" cy="149" r="14.5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="211" cy="149" r="7" fill="#334155"/>
    <circle cx="209" cy="147" r="2.5" fill="#ffffff" opacity="0.9"/>
    <!-- Cam Bottom-Right -->
    <circle cx="241" cy="179" r="14.5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="241" cy="179" r="7" fill="#334155"/>
    <circle cx="239" cy="177" r="2.5" fill="#ffffff" opacity="0.9"/>
